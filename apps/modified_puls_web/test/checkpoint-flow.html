<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Modified Puls checkpoint flow test</title>
  <style>
    body { max-width: 900px; margin: 35px auto; font: 16px/1.5 Arial, sans-serif; color: #093d5e; }
    #result { padding: 18px; border-radius: 9px; background: #edf2f4; white-space: pre-wrap; }
    .pass { color: #244414; background: #edf6d5 !important; }
    .fail { color: #7b2222; background: #fff0f0 !important; }
    iframe { position: absolute; left: -10000px; width: 1400px; height: 1200px; }
  </style>
</head>
<body>
  <h1>Modified Puls checkpoint flow test</h1>
  <div id="result">Running end-to-end checkpoint checks…</div>
  <iframe id="app" src="../index.html" title="Modified Puls app under test"></iframe>
  <script>
    "use strict";
    sessionStorage.removeItem("training-checkpoints:modified-puls:v1");
    const result = document.getElementById("result");
    const frame = document.getElementById("app");
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const choose = (doc, name, value) => {
      const input = doc.querySelector(`input[name="${name}"][value="${value}"]`);
      assert(input, `Missing ${name}=${value}`);
      input.click();
    };
    const passCurrent = (doc) => {
      doc.getElementById("checkpoint-check").click();
      assert(doc.getElementById("checkpoint-feedback").classList.contains("is-success"), `Checkpoint failed: ${doc.getElementById("checkpoint-feedback").textContent}`);
    };
    const next = (doc, expected) => {
      doc.getElementById("checkpoint-next").click();
      assert(doc.getElementById("checkpoint-number").textContent.includes(expected), `Did not advance to checkpoint ${expected}`);
    };

    frame.addEventListener("load", async () => {
      try {
        await wait(1200);
        const doc = frame.contentDocument;
        assert(doc.getElementById("checkpoint-number").textContent.includes("1 of 5"), "App did not open at Checkpoint 1");
        assert(doc.getElementById("sandbox-shell").classList.contains("is-checkpoint-locked"), "Sandbox was not initially locked");

        const curve = doc.getElementById("qc-curve-select");
        curve.value = "MP03_PROP_2";
        curve.dispatchEvent(new Event("change", { bubbles: true }));
        choose(doc, "qc-reach-decision", "accept");
        passCurrent(doc);
        next(doc, "2 of 5");

        choose(doc, "qc-geometry-action", "regenerate");
        passCurrent(doc);
        assert(!doc.getElementById("qc-geometry-reveal").hidden, "Geometry comparison was not revealed");
        next(doc, "3 of 5");

        assert(frame.contentWindow.getComputedStyle(doc.getElementById("qc-resolution-followup")).display === "none", "Resolution follow-up was revealed before Reject was selected");
        choose(doc, "qc-resolution-decision", "reject");
        doc.getElementById("qc-resolution-concern").value = "operating-range-resolution";
        choose(doc, "qc-preferred-curve", "A");
        passCurrent(doc);
        next(doc, "4 of 5");

        choose(doc, "qc-subreach-decision", "reject");
        passCurrent(doc);
        next(doc, "5 of 5");

        assert(frame.contentWindow.getComputedStyle(doc.getElementById("qc-final-reasons")).display === "none", "Final return reasons were revealed before Return was selected");
        choose(doc, "qc-final-decision", "return");
        doc.querySelector('#qc-final-reasons input[value="stale-geometry"]').click();
        doc.querySelector('#qc-final-reasons input[value="inadequate-resolution"]').click();
        passCurrent(doc);
        assert(!doc.getElementById("checkpoint-complete").hidden, "Final takeaway was not displayed");
        assert(!doc.getElementById("sandbox-shell").classList.contains("is-checkpoint-locked"), "Sandbox did not unlock");

        doc.querySelector('.tab[data-act="2"]').click();
        assert(!doc.getElementById("act-2").hidden, "Mechanics explorer tab did not open");
        const slider = doc.getElementById("mult-slider");
        slider.value = "1.5";
        slider.dispatchEvent(new Event("input", { bubbles: true }));
        assert(doc.getElementById("mult-out").textContent === "1.50", "Storage sensitivity control did not update");
        doc.querySelector('.tab[data-act="3"]').click();
        assert(!doc.getElementById("act-3").hidden, "Result explorer tab did not open");
        assert(doc.getElementById("result-table").querySelectorAll("tbody tr").length === 5, "Routing result summary did not render");

        doc.getElementById("checkpoint-reset").click();
        assert(doc.getElementById("checkpoint-number").textContent.includes("1 of 5"), "Reset did not return to Checkpoint 1");
        assert(doc.getElementById("sandbox-shell").classList.contains("is-checkpoint-locked"), "Reset did not lock the sandbox");

        result.className = "pass";
        result.textContent = "PASS: all five checkpoints, final unlock, sandbox controls, and Reset Training completed successfully.";
      } catch (error) {
        result.className = "fail";
        result.textContent = `FAIL: ${error.stack || error.message}`;
      }
    }, { once: true });
  </script>
</body>
</html>
